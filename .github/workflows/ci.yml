name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Real ComfyUI (latest), this pack in custom_nodes, CPU: the suite against the core on a tiny synthetic MOSS-Image model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI

      - name: Checkout this pack into custom_nodes
        uses: actions/checkout@v4
        with:
          path: ComfyUI/custom_nodes/HaDeS-MOSS-Suite

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ComfyUI
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt

      - name: Run tests
        run: python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_suite.py
