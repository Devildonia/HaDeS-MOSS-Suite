name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Supported baseline plus upstream changes; Windows also checks case-insensitive source protection.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comfy-ref: v0.43.0
          - os: ubuntu-latest
            comfy-ref: master
          - os: windows-latest
            comfy-ref: v0.43.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ComfyUI
        uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy-ref }}
          path: ComfyUI

      - name: Checkout this pack into custom_nodes
        uses: actions/checkout@v7
        with:
          path: ComfyUI/custom_nodes/HaDeS-MOSS-Suite

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: for f in ComfyUI/custom_nodes/HaDeS-MOSS-Suite/web/*.js; do node --check "$f"; done

      - name: Check frontend behavior
        run: node --test ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_widgets.mjs

      - name: Install ComfyUI
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt

      - name: Run tests
        run: |
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_suite.py
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_edit_eval.py
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_dev_nodes.py
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_pair_check.py

  package:
    # The Comfy Registry package as a user gets it: built by comfy-cli from this commit (honouring .comfyignore), unpacked into
    # a clean ComfyUI with no git checkout, then loaded by a running server (tests/check_package.py)
    strategy:
      fail-fast: false
      matrix:
        comfy-ref: [v0.43.0, master]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this pack (for comfy node pack and the checks)
        uses: actions/checkout@v7
        with:
          path: pack

      - name: Checkout ComfyUI
        uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy-ref }}
          path: ComfyUI

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package with comfy-cli
        working-directory: pack
        run: |
          pip install comfy-cli
          comfy --skip-prompt tracking disable || true
          comfy --skip-prompt node pack
          ls -l node.zip

      - name: Check the package contents
        run: python pack/tests/check_package.py contents pack/node.zip

      - name: Install ComfyUI and the package
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt
          mkdir -p ComfyUI/custom_nodes/HaDeS-MOSS-Suite
          unzip -q pack/node.zip -d ComfyUI/custom_nodes/HaDeS-MOSS-Suite

      - name: Load the package in a running ComfyUI
        run: |
          python ComfyUI/main.py --cpu --listen 127.0.0.1 --port 8188 > comfyui.log 2>&1 &
          status=0
          python pack/tests/check_package.py server --server http://127.0.0.1:8188 --log comfyui.log || status=$?
          kill %1 || true
          tail -n 40 comfyui.log
          exit $status
