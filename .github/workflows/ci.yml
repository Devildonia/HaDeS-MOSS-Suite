name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Supported baseline plus upstream changes; Windows also checks case-insensitive source protection.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comfy-ref: v0.43.0
          - os: ubuntu-latest
            comfy-ref: master
          - os: windows-latest
            comfy-ref: v0.43.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ComfyUI
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy-ref }}
          path: ComfyUI

      - name: Checkout this pack into custom_nodes
        uses: actions/checkout@v4
        with:
          path: ComfyUI/custom_nodes/HaDeS-MOSS-Suite

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: for f in ComfyUI/custom_nodes/HaDeS-MOSS-Suite/web/*.js; do node --check "$f"; done

      - name: Check frontend behavior
        run: node --test ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_widgets.mjs

      - name: Install ComfyUI
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt

      - name: Run tests
        run: |
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_suite.py
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_edit_eval.py
          python ComfyUI/custom_nodes/HaDeS-MOSS-Suite/tests/test_moss_dev_nodes.py
