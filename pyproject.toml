[project]
name = "hades-moss-suite"
description = "ComfyUI nodes for the MOSS-Image model family: a one-node loader, block and multi-model (TIES, DARE, Model Stock, SLERP) mergers for the 42-layer single-stream DiT, a model saver (bf16 with stochastic rounding, float32, int8 ConvRot), a multi-LoRA loader with per-layer-group strength and LoRA tools (extractor, merger, resize), a prompt enhancer that writes captions or layouts with the model's own text encoder, a visual layout editor and compiler, a latent node with a shared seed, a KSampler with metadata and a turbo input for our own 4- and 8-step LoRAs, and a telemetry node."
version = "0.4.0"
authors = [
    { name = "Devildonia" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: ComfyUI",
]
keywords = [
    "comfyui",
    "moss-image",
    "model-merging",
    "flow-matching",
    "few-step",
    "lora",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Devildonia/HaDeS-MOSS-Suite"
"Bug Tracker" = "https://github.com/Devildonia/HaDeS-MOSS-Suite/issues"

[tool.comfy]
PublisherId = "hades"
DisplayName = "HaDeS MOSS Suite"
Icon = "https://raw.githubusercontent.com/Devildonia/HaDeS-MOSS-Suite/main/web/icon.png"
includes = [
    "web",
    "examples",
]
