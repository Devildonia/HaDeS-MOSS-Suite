[project]
name = "hades-moss-suite"
description = "ComfyUI nodes for the MOSS-Image model family: block and multi-model (TIES, DARE, Model Stock, SLERP) mergers for the 42-layer single-stream DiT and a model saver (bf16, float32, int8 ConvRot), with more merging and LoRA tools to come."
version = "0.1.0"
authors = [
    { name = "Devildonia" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: ComfyUI",
]
keywords = [
    "comfyui",
    "moss-image",
    "model-merging",
    "flow-matching",
]
dependencies = []

[tool.comfy]
PublisherId = "hades"
DisplayName = "HaDeS MOSS Suite"
