[project]
name = "hades-moss-suite"
description = "ComfyUI nodes for the MOSS-Image model family: a one-node loader, block and multi-model mergers (TIES, DARE, Model Stock, SLERP), a model saver (bf16 with stochastic rounding, float32, int8 ConvRot) that stores the recipe, a metadata reader, a multi-LoRA loader with per-layer-group strength and LoRA tools (extractor, merger, resize), color / depth control with a depth map maker (Depth Anything V2), a prompt enhancer that writes captions, detailed or random prompts, layouts or edit references with the model's own text encoder, a layout editor that drafts the boxes from a sentence before generating, a KSampler with metadata and a turbo input for our 4- and 8-step LoRAs, an image saver with A1111 metadata for Civitai, a compare sampler and compare sheet for up to four models or LoRAs (blind mode too), a text check that reads the text in an image, and a telemetry node."
version = "1.0.0"
authors = [
    { name = "Devildonia" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: ComfyUI",
]
keywords = [
    "comfyui",
    "moss-image",
    "model-merging",
    "flow-matching",
    "few-step",
    "lora",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Devildonia/HaDeS-MOSS-Suite"
"Bug Tracker" = "https://github.com/Devildonia/HaDeS-MOSS-Suite/issues"

[tool.comfy]
PublisherId = "hades"
DisplayName = "HaDeS MOSS Suite"
Icon = "https://raw.githubusercontent.com/Devildonia/HaDeS-MOSS-Suite/main/web/icon.png"
# web/ and examples/ are git-tracked, so they are packaged without being listed here; listing them would force them in past
# .comfyignore (comfy-cli), which keeps the Dev Tools out
includes = []
