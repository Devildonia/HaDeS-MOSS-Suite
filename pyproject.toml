[project]
name = "hades-moss-suite"
description = "ComfyUI nodes for the MOSS-Image model family: block and multi-model (TIES, DARE, Model Stock, SLERP) mergers for the 42-layer single-stream DiT a model saver (bf16, float32, int8 ConvRot), LoRA tools (extractor, merger, resize, per-layer-group strength) a latent node, a layout compiler, a KSampler with metadata and a telemetry node."
version = "0.1.0"
authors = [
    { name = "Devildonia" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: ComfyUI",
]
keywords = [
    "comfyui",
    "moss-image",
    "model-merging",
    "flow-matching",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Devildonia/HaDeS-MOSS-Suite"
"Bug Tracker" = "https://github.com/Devildonia/HaDeS-MOSS-Suite/issues"

[tool.comfy]
PublisherId = "hades"
DisplayName = "HaDeS MOSS Suite"
includes = [
    "web",
    "examples",
]
